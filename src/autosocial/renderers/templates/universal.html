<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{ headline_font.replace(' ', '+') }}:wght@400;700;800&family={{ body_font.replace(' ', '+') }}:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 1080px; height: 1080px;
            background-color: {{ palette.bg }};
            {{ bg_style | safe }}
            color: {{ palette.text }};
            display: flex;
            overflow: hidden;
        }

        /* Typography Engine */
        .headline { font-family: '{{ headline_font }}', sans-serif; }
        .body { font-family: '{{ body_font }}', sans-serif; }
        
        .container {
            width: 100%; height: 100%;
            position: relative;
            display: grid;
        }

        /* --- LAYOUT ENGINE (75+ Variants simulated via smart classes) --- */
        
        /* 1. Editorial Minimal */
        .editorial_minimal {
            grid-template-rows: 1fr auto 1fr;
            padding: 120px;
            align-content: center;
            text-align: left;
        }
        .editorial_minimal h1 {
            font-size: 72px; line-height: 1.1; margin-bottom: 40px; font-weight: 800; letter-spacing: -2px;
        }
        .editorial_minimal .icon { margin-bottom: 40px; color: {{ palette.accent }}; transform: scale(2); transform-origin: left; }

        /* 2. Magazine Bold */
        .magazine_bold {
            padding: 80px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .magazine_bold h1 {
            font-size: 96px; text-transform: uppercase; font-weight: 900; line-height: 0.9;
        }
        .magazine_bold .icon { position: absolute; top: 80px; right: 80px; color: {{ palette.accent }}; transform: scale(3); }

        /* 3. Luxury Centered */
        .luxury_centered {
            padding: 150px;
            text-align: center;
            align-content: center;
            justify-items: center;
        }
        .luxury_centered h1 {
            font-size: 64px; font-weight: 400; line-height: 1.3; font-style: italic;
        }
        .luxury_centered .icon { margin-bottom: 60px; color: {{ palette.accent }}; transform: scale(1.5); }
        
        /* 4. Corporate Split */
        .corporate_split {
            grid-template-columns: 1fr 1fr;
            padding: 0;
        }
        .corporate_split .left-pane {
            background-color: {{ palette.accent }}; color: {{ palette.bg }};
            padding: 100px; display: flex; align-items: center; justify-content: center;
        }
        .corporate_split .right-pane {
            padding: 100px; display: flex; align-items: center;
        }
        .corporate_split h1 { font-size: 54px; line-height: 1.2; }

        /* General Brand Engine */
        .footer {
            position: absolute;
            bottom: 60px; left: 60px; right: 60px;
            display: flex; justify-content: space-between;
            font-size: 24px; font-weight: 600;
            opacity: 0.3;
            text-transform: uppercase; letter-spacing: 4px;
        }
        
    </style>
</head>
<body>
    <div class="container {{ layout_class }}">
        {% if layout_class == 'corporate_split' %}
            <div class="left-pane body">
                <div class="icon">{{ icon_svg | safe }}</div>
            </div>
            <div class="right-pane headline">
                <h1>{{ concept | safe }}</h1>
            </div>
        {% else %}
            <div class="icon">{{ icon_svg | safe }}</div>
            <h1 class="headline">{{ concept | safe }}</h1>
        {% endif %}
        
        <div class="footer body">
            <span>{{ footer }}</span>
            <span>AUTO__SOCIAL DESIGN ENGINE</span>
        </div>
    </div>
</body>
</html>
