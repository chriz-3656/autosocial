<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            padding: 80px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 800px;
        }
        h1 {
            font-size: 80px;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .brand {
            margin-top: 50px;
            font-size: 40px;
            font-weight: 300;
            letter-spacing: 5px;
            color: #a8c0ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ concept }}</h1>
        <div class="brand">@{{ brand }}</div>
    </div>
</body>
</html>
